{% if page.has_other_pages %}
<nav class="pagination" aria-label="Pagination">
  {% if page.has_previous %}<a href="{% querystring page=page.previous_page_number %}" aria-label="Page précédente">←</a>{% endif %}
  {% for n in page.paginator.get_elided_page_range %}
    {% if n == page.number %}<span class="current" aria-current="page">{{ n }}</span>
    {% elif n == page.paginator.ELLIPSIS %}<span>…</span>
    {% else %}<a href="{% querystring page=n %}">{{ n }}</a>{% endif %}
  {% endfor %}
  {% if page.has_next %}<a href="{% querystring page=page.next_page_number %}" aria-label="Page suivante">→</a>{% endif %}
</nav>
{% endif %}
